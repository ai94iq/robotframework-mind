# Tests offscreen on Linux, Windows and macOS on every push and pull request; every run also builds and
# self-checks the desktop bundles. A vX.Y.Z tag (equal to __version__) attaches them to a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -q -U pip && python -m pip install -q -e ".[dev,gui]"
      - run: python -m pytest -q

  bundles:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python packaging/build_bundle.py bundles
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/

  installer:
    needs: bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bundle-windows-latest
          path: bundles
      - name: Compile the per-user installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found on this runner." }
          $version = python -c "import ast; t=open('robot_mind_app/__init__.py').read(); print([n.value.value for n in ast.parse(t).body if isinstance(n,ast.Assign) and getattr(n.targets[0],'id','')=='__version__'][0])"
          & $iscc "/DAppVersion=$version" "packaging/installer.iss"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-windows-installer
          path: bundles/*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bundles, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach files to the GitHub release, this job only
    steps:
      - uses: actions/checkout@v7.0.1
      # The tag must equal the code's version, or the release holds mislabelled files.
      - run: |
          version=$(python3 -c 'import ast; t=open("robot_mind_app/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - run: cd bundles && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: bundles/*
          body_path: packaging/release-notes.md

  pypi-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      # Same guard as the release job: the tag must equal the code's version.
      - run: |
          version=$(python3 -c 'import ast; t=open("robot_mind_app/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m pip install -q -U pip build twine && python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pypi-dist
          path: dist/

  # Trusted publishing: no token is stored. The project's PyPI settings name this
  # repo, workflow file (ci.yml) and environment (pypi) as the allowed publisher.
  pypi-publish:
    needs: pypi-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # mint the short-lived PyPI credential, this job only
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
